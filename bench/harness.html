<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dirview Bench Harness</title>
  <link href="/out/webview/style.css" rel="stylesheet">
  <link href="/out/webview/languages.css" rel="stylesheet">
  <link href="/out/webview/tab.css" rel="stylesheet">
  <style>
    /* VSCode Dark+ theme variable approximations */
    :root {
      --vscode-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --vscode-font-size: 13px;
      --vscode-foreground: #cccccc;
      --vscode-descriptionForeground: #9d9d9d;
      --vscode-editor-background: #1e1e1e;
      --vscode-editor-foreground: #d4d4d4;
      --vscode-sideBar-background: #252526;
      --vscode-sideBar-border: #414141;
      --vscode-input-background: #3c3c3c;
      --vscode-input-foreground: #cccccc;
      --vscode-input-border: #3c3c3c;
      --vscode-input-placeholderForeground: #a6a6a6;
      --vscode-focusBorder: #007fd4;
      --vscode-list-hoverBackground: #2a2d2e;
      --vscode-list-activeSelectionBackground: #094771;
      --vscode-list-activeSelectionForeground: #ffffff;
      --vscode-toolbar-hoverBackground: #5a5d5e50;
      --vscode-button-background: #0e639c;
      --vscode-button-foreground: #ffffff;
      --vscode-button-hoverBackground: #1177bb;
      --vscode-progressBar-background: #0e70c0;
      --vscode-editorHoverWidget-background: #252526;
      --vscode-editorHoverWidget-border: #454545;
      --vscode-editorHoverWidget-foreground: #cccccc;
      --vscode-widget-shadow: #00000029;
      --vscode-editor-findMatchHighlightBackground: #ea5c0055;
      --vscode-editorWarning-foreground: #cca700;
      --vscode-inputOption-activeForeground: #ffffff;
      --vscode-inputOption-activeBackground: #007fd466;
      --vscode-inputOption-activeBorder: #007fd4;
      --vscode-inputValidation-warningBackground: #352a05;
      --vscode-inputValidation-warningBorder: #9b8500;
      --vscode-inputValidation-warningForeground: #cca700;
      --vscode-tree-indentGuidesStroke: #585858;
      --vscode-tree-inactiveIndentGuidesStroke: #3a3a3a;
      --vscode-icon-foreground: #c5c5c5;
      --vscode-badge-background: #4d4d4d;
      --vscode-badge-foreground: #ffffff;
      --vscode-panel-border: #80808059;
      --vscode-editor-font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
      --vscode-editorLineNumber-foreground: #858585;
      color: var(--vscode-foreground);
      font-family: var(--vscode-font-family);
      font-size: var(--vscode-font-size);
    }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--vscode-editor-background); }

    /* ── Bench control panel ────────────────────────────────────── */
    #bench-panel {
      position: fixed; bottom: 12px; right: 12px; z-index: 10000;
      background: #2d2d30; border: 1px solid #454545; border-radius: 6px;
      padding: 10px 14px; min-width: 240px;
      font-size: 12px; color: #ccc; box-shadow: 0 4px 12px #0006;
    }
    #bench-panel h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: #888; }
    #bench-panel button {
      background: var(--vscode-button-background); color: var(--vscode-button-foreground);
      border: none; border-radius: 3px; padding: 4px 10px; cursor: pointer; margin: 2px 4px 2px 0; font-size: 12px;
    }
    #bench-panel button:hover { background: var(--vscode-button-hoverBackground); }
    #bench-panel .bench-row { margin: 4px 0; display: flex; align-items: center; gap: 8px; }
    #bench-panel .bench-label { color: #888; min-width: 100px; }
    #bench-panel .bench-value { color: #4ec9b0; font-family: var(--vscode-editor-font-family); }
    #bench-panel .bench-status { color: #888; font-style: italic; margin: 6px 0; }
    #bench-panel input[type="file"] { display: none; }
  </style>
  <script>
    // ── Mock acquireVsCodeApi ──────────────────────────────────
    // Must be defined before tab.js loads (it calls acquireVsCodeApi() at module scope).
    window.__benchBridge = {
      ws: null,
      outgoing: [],
      send(msg) {
        this.outgoing.push(msg);
        if (this.ws && this.ws.readyState === WebSocket.OPEN) {
          this.ws.send(JSON.stringify(msg));
        }
      }
    };
    window.acquireVsCodeApi = function() {
      return {
        postMessage(message) { window.__benchBridge.send(message); },
        getState() { return null; },
        setState() {}
      };
    };
  </script>
</head>
<body class="tab-view">

  <div id="root"></div>

  <!-- Load the unmodified tab.js IIFE bundle -->
  <script src="/out/webview/tab.js"></script>

  <!-- Bench harness controls (after tab.js so it doesn't interfere with init) -->
  <script>
    (function() {
      'use strict';

      // ── Bench panel UI ──────────────────────────────────────────
      const panel = document.createElement('div');
      panel.id = 'bench-panel';
      panel.innerHTML = `
        <h3>Bench Harness</h3>
        <div class="bench-status" id="bench-status">No fixture loaded</div>
        <div>
          <button id="bench-load">Load Fixture</button>
          <button id="bench-run" disabled>Run Benchmark</button>
          <input type="file" id="bench-file" accept=".json">
        </div>
        <div id="bench-results" style="margin-top:8px"></div>
      `;
      document.body.appendChild(panel);

      const statusEl = document.getElementById('bench-status');
      const resultsEl = document.getElementById('bench-results');
      const loadBtn = document.getElementById('bench-load');
      const runBtn = document.getElementById('bench-run');
      const fileInput = document.getElementById('bench-file');
      let currentFixture = null;

      // ── Send update message to the tab renderer ─────────────────
      function sendUpdate(root) {
        window.postMessage({
          type: 'update',
          roots: [root],
          autoRescanEnabled: true,
          sortMode: 'files',
          truncateThreshold: 4,
          stickyHeadersEnabled: true,
          showIgnored: false,
          dirPath: '',
          workspaceFolderName: root.name,
        }, '*');
      }

      // ── Fixture loading ─────────────────────────────────────────
      function loadFixture(root) {
        currentFixture = root;
        statusEl.textContent = `Loaded: ${root.name} (${root.totalFiles} files)`;
        runBtn.disabled = false;
        sendUpdate(root);
      }

      loadBtn.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', async () => {
        const file = fileInput.files[0];
        if (!file) return;
        const text = await file.text();
        loadFixture(JSON.parse(text));
      });

      // ── Auto-load from URL param ───────────────────────────────
      const params = new URLSearchParams(location.search);
      const fixturePath = params.get('fixture');
      if (fixturePath) {
        statusEl.textContent = `Loading ${fixturePath}...`;
        fetch(fixturePath)
          .then(r => { if (!r.ok) throw new Error(r.statusText); return r.json(); })
          .then(loadFixture)
          .catch(err => { statusEl.textContent = `Error: ${err.message}`; });
      }

      // ── WebSocket bridge ────────────────────────────────────────
      const wsParam = params.get('ws');
      if (wsParam) {
        statusEl.textContent = `Connecting to ws://${wsParam}...`;
        const ws = new WebSocket(`ws://${wsParam}`);
        window.__benchBridge.ws = ws;
        ws.onopen = () => { statusEl.textContent = `Connected to ws://${wsParam}`; };
        ws.onmessage = (e) => {
          const msg = JSON.parse(e.data);
          window.postMessage(msg, '*');
        };
        ws.onclose = () => { statusEl.textContent = 'WebSocket disconnected'; };
        ws.onerror = () => { statusEl.textContent = 'WebSocket error'; };
      }

      // ── Benchmark runner ────────────────────────────────────────
      // Waits for the double-rAF render cycle to complete, then resolves.
      function waitForRender() {
        return new Promise(resolve => {
          requestAnimationFrame(() => requestAnimationFrame(resolve));
        });
      }

      async function runBenchmark() {
        if (!currentFixture) return;
        runBtn.disabled = true;
        resultsEl.innerHTML = '';

        const iterations = 5;
        const results = { initial: [], rerender: [], expandChildren: [], expandDeep: [] };
        const expandBtn = document.getElementById('tab-expand-all');
        const collapseBtn = document.getElementById('tab-collapse-all');

        for (let i = 0; i < iterations; i++) {
          // Initial render (fresh update)
          performance.mark('bench-initial-start');
          sendUpdate(currentFixture);
          await waitForRender();
          performance.mark('bench-initial-end');
          performance.measure('initial-render', 'bench-initial-start', 'bench-initial-end');

          // Re-render (incremental DOM patching, same data)
          performance.mark('bench-rerender-start');
          sendUpdate(currentFixture);
          await waitForRender();
          performance.mark('bench-rerender-end');
          performance.measure('rerender', 'bench-rerender-start', 'bench-rerender-end');

          // Expand children (tier 1 — top-level only)
          performance.mark('bench-expand-children-start');
          expandBtn.click();
          await waitForRender();
          performance.mark('bench-expand-children-end');
          performance.measure('expand-children', 'bench-expand-children-start', 'bench-expand-children-end');

          // Expand deep (tier 2 — full recursive expand, second click)
          performance.mark('bench-expand-deep-start');
          expandBtn.click();
          await waitForRender();
          performance.mark('bench-expand-deep-end');
          performance.measure('expand-deep', 'bench-expand-deep-start', 'bench-expand-deep-end');

          // Collapse all (reset for next iteration)
          collapseBtn.click();
          await waitForRender();

          // Collect measurements
          const nameToKey = { 'initial-render': 'initial', 'rerender': 'rerender', 'expand-children': 'expandChildren', 'expand-deep': 'expandDeep' };
          for (const m of performance.getEntriesByType('measure')) {
            const key = nameToKey[m.name];
            if (key) results[key].push(m.duration);
          }
          performance.clearMarks();
          performance.clearMeasures();
        }

        // Display results
        function stats(arr) {
          const sorted = [...arr].sort((a, b) => a - b);
          const median = sorted[Math.floor(sorted.length / 2)];
          const mean = arr.reduce((a, b) => a + b, 0) / arr.length;
          const min = sorted[0];
          const max = sorted[sorted.length - 1];
          return { median: median.toFixed(1), mean: mean.toFixed(1), min: min.toFixed(1), max: max.toFixed(1) };
        }

        let html = '';
        for (const [label, values] of Object.entries(results)) {
          const s = stats(values);
          html += `<div class="bench-row"><span class="bench-label">${label}</span><span class="bench-value">${s.median}ms</span><span style="color:#888;font-size:11px">(mean ${s.mean}, min ${s.min}, max ${s.max})</span></div>`;
        }
        resultsEl.innerHTML = html;

        // Expose results for automated runner
        window.__benchResults = results;
        runBtn.disabled = false;
      }

      runBtn.addEventListener('click', runBenchmark);

      // Auto-run benchmark if ?autorun param is present (for bench.mjs)
      if (params.has('autorun')) {
        // Wait for fixture to load, then run
        const checkReady = setInterval(() => {
          if (currentFixture) {
            clearInterval(checkReady);
            runBenchmark();
          }
        }, 100);
      }
    })();
  </script>
</body>
</html>
